<h1>사이트 소개</h1>
<p>이 사이트는 무선 이어폰의 가격 비교 데이터를 제공합니다. 국내 가격 비교 서비스(에누리, 다나와)에서 상품별 최저가와 판매처 수를 수집해 정리합니다.</p>
<h2>데이터 방침</h2>
<ul>
<li>모든 페이지에 데이터 출처(수집한 사이트의 도메인)와 수집 시각을 명시합니다.</li>
<li>가격은 수집 시점의 값이며, 실시간 가격과 다를 수 있습니다. 각 페이지에 기준일을 표기합니다.</li>
<li>특정 판매처를 홍보하거나 구매를 유도하지 않으며, 제휴 링크를 사용하지 않습니다.</li>
</ul>
